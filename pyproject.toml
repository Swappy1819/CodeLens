[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codelens"
version = "0.1.0"
description = "LLM-powered repository-aware code review"
dependencies = [
    "neo4j==5.28.4",
    "google-genai",
    "pyvis",
]

[project.scripts]
codelens = "codelens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]